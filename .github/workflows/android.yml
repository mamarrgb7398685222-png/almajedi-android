name: Build Almajedi APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Almajedi-Store.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Almajedi-Store-APK
          path: Almajedi-Store.apk
          retention-days: 30
